<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Central de Pedidos | L&G Delícias</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body class="admin"><main class="admin-shell"><header class="admin-head"><div><p class="eyebrow">L&G Delícias</p><h1>Central de Pedidos</h1></div><a href="/">Voltar ao site</a></header><section id="login" class="panel login"><h2>Acesso administrativo</h2><p>Digite a chave segura configurada na hospedagem.</p><form id="login-form"><label>Chave de acesso<input id="key" type="password" required></label><button class="primary">Entrar</button></form><p id="login-status" class="admin-status"></p></section><div id="admin-area" hidden><nav class="admin-tabs"><button class="active" data-tab="orders">Pedidos <span id="new-count">0</span></button><button data-tab="products">Produtos</button></nav><section id="orders" class="panel"><div class="orders-toolbar"><div><h2>Pedidos recebidos</h2><p id="orders-status" class="admin-status">Atualização automática a cada 20 segundos.</p></div><select id="status-filter" aria-label="Filtrar pedidos"><option value="all">Todos</option><option value="new">Novos</option><option value="preparing">Em preparo</option><option value="ready">Prontos</option><option value="completed">Finalizados</option><option value="cancelled">Cancelados</option></select></div><div id="orders-list"></div></section><section id="products" class="panel" hidden><p id="save-status" class="admin-status">Marque cada produto como disponível ou esgotado.</p><div id="admin-list"></div></section></div></main><script src="/admin/admin.js" defer></script></body></html>
